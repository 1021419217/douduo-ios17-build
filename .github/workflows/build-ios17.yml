name: Build DouDuo iOS 17 IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build DouDuo iOS 17 Unsigned IPA (xcode-27)
    # xcode-27 runner: macOS 27 + Xcode 27 beta + iOS 27 SDK
    # DouDuo 源码用了 iOS 27.1 API (reservedRegions/glassEffect 等), 必须用 iOS 27 SDK 编译
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          uname -m
          ls -d /Applications/Xcode*.app || true
          # 优先选 Xcode 27
          X27=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X27" ]; then
            echo "selected: $X27"
            sudo xcode-select -s "$X27"
          else
            NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
            echo "Xcode 27 not found, selected newest: $NEWEST"
            sudo xcode-select -s "$NEWEST" || true
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch VLCKit (~1GB, required)
        run: |
          chmod +x ./scripts/fetch-vlckit.sh
          ./scripts/fetch-vlckit.sh
          ls -lh Vendor/VLCKit/

      - name: Generate project (deployment target iOS 17)
        run: |
          grep -n "iOS:" project.yml
          xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project DouDuo.xcodeproj -scheme DouDuo

      - name: Build unsigned
        run: |
          set -o pipefail
          xcodebuild -project DouDuo.xcodeproj -scheme DouDuo -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        if: success()
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" || true
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry DouDuo-1.7.2-ios17-unsigned.ipa Payload
          ls -lh DouDuo-1.7.2-ios17-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DouDuo-ios17-unsigned
          path: DouDuo-1.7.2-ios17-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
